name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run plugin unit tests
        run: php tests/run.php

      - name: Validate plugin metadata
        run: |
          test -f payment-method-highlighter-for-woocommerce.php
          grep -q 'Plugin Name: Payment Method Highlighter for WooCommerce' payment-method-highlighter-for-woocommerce.php
          grep -q 'Version:' payment-method-highlighter-for-woocommerce.php
          grep -q 'WC requires at least:' payment-method-highlighter-for-woocommerce.php
